<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On | Modern AR Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #10b981;
            --light-green: #d1fae5;
            --dark-green: #059669;
        }

        .gradient-bg { 
            background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%); 
        }

        .glass-effect { 
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(16, 185, 129, 0.1);
            box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.1);
        }

        .glass-effect-dark { 
            backdrop-filter: blur(20px);
            background: rgba(16, 185, 129, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.3);
        }

        .video-container { 
            position: relative; 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 
                0 20px 60px -12px rgba(16, 185, 129, 0.3),
                0 0 0 1px rgba(16, 185, 129, 0.1);
            border: 3px solid var(--primary-green);
            transition: all 0.3s ease;
        }

        .video-container:hover {
            box-shadow: 
                0 25px 70px -12px rgba(16, 185, 129, 0.4),
                0 0 0 1px rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
        }

        .video-feed { 
            transition: all 0.3s ease; 
            border-radius: 24px; 
        }

        .control-button { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            background: rgba(16, 185, 129, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .control-button:hover { 
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
            background: rgba(5, 150, 105, 0.95);
        }

        .control-button:active {
            transform: translateY(-1px) scale(0.98);
        }

        .image-thumbnail {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: white;
        }

        .image-thumbnail:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.2);
            border-color: var(--light-green);
        }

        .image-thumbnail.active {
            border: 3px solid var(--primary-green);
            box-shadow: 0 12px 28px rgba(16, 185, 129, 0.4);
            transform: scale(1.05);
        }

        .image-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-thumbnail::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(16, 185, 129, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-thumbnail:hover::after {
            opacity: 1;
        }

        .floating-panel { 
            animation: float 4s ease-in-out infinite; 
        }

        @keyframes float { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-6px); } 
        }

        .scroll-area { 
            max-height: 420px; 
            overflow-y: auto; 
        }

        .scroll-area::-webkit-scrollbar { 
            width: 6px; 
        }

        .scroll-area::-webkit-scrollbar-track { 
            background: rgba(16, 185, 129, 0.05);
            border-radius: 10px;
        }

        .scroll-area::-webkit-scrollbar-thumb { 
            background: var(--primary-green);
            border-radius: 10px;
        }

        .scroll-area::-webkit-scrollbar-thumb:hover { 
            background: var(--dark-green);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0px);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--light-green);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .metric-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(16, 185, 129, 0.02) 100%);
            border: 2px solid rgba(16, 185, 129, 0.1);
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            border-color: var(--primary-green);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
            transform: translateX(4px);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary-green) 0%, var(--dark-green) 100%);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .gesture-icon {
            background: linear-gradient(135deg, var(--light-green) 0%, rgba(16, 185, 129, 0.1) 100%);
            border: 2px solid var(--primary-green);
        }

        .pulse-green {
            animation: pulse-green 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-green {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            50% {
                opacity: 0.8;
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
            }
        }

        .badge-green {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .nav-modern {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.1);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.08);
        }

        .card-modern {
            background: white;
            border: 2px solid rgba(16, 185, 129, 0.1);
            transition: all 0.3s ease;
        }

        .card-modern:hover {
            border-color: var(--primary-green);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.15);
        }

        .overlay-badge {
            background: rgba(16, 185, 129, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Modern shimmer effect */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.1), transparent);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen gradient-bg">
    <!-- Modern Navigation -->
    <nav class="nav-modern p-5 mb-8 sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-tshirt text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-600 to-emerald-500 bg-clip-text text-transparent">
                        Virtual Try-On
                    </h1>
                    <p class="text-xs text-gray-500 font-medium">AR Experience</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <button class="flex items-center space-x-2 px-4 py-2 rounded-xl bg-white border-2 border-emerald-500 text-emerald-600 hover:bg-emerald-50 transition-all">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="cart-count" class="badge-green text-white text-xs rounded-full px-2 py-0.5 font-bold">0</span>
                    </button>
                </div>
                <button onclick="toggleOverlay()" class="px-4 py-2 rounded-xl bg-white border-2 border-emerald-500 text-emerald-600 hover:bg-emerald-50 transition-all font-medium">
                    <i id="overlay-icon" class="fas fa-eye mr-2"></i>
                    <span id="overlay-text">Overlay</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 pb-12">
        <div class="grid lg:grid-cols-4 gap-6">
            <!-- Left Panel - Product Images -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Product Images Panel -->
                <div class="glass-effect rounded-3xl p-5 floating-panel card-modern">
                    <div class="flex items-center justify-between mb-5">
                        <h3 class="text-lg font-bold text-gray-800 flex items-center">
                            <div class="w-8 h-8 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-lg flex items-center justify-center mr-3">
                                <i class="fas fa-images text-white text-sm"></i>
                            </div>
                            Product Views
                        </h3>
                        <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">
                            <i class="fas fa-image mr-1"></i>
                            <span id="total-images">0</span>
                        </span>
                    </div>
                    <div id="product-images-grid" class="scroll-area grid grid-cols-2 gap-3">
                        <div class="text-gray-400 text-sm text-center py-12 col-span-2">
                            <i class="fas fa-image text-4xl mb-3 opacity-30"></i>
                            <p>No product loaded</p>
                        </div>
                    </div>
                </div>

                <!-- Gesture Guide Panel -->
                <div class="glass-effect rounded-3xl p-5 card-modern">
                    <h3 class="text-sm font-bold text-gray-800 mb-4 flex items-center">
                        <div class="w-7 h-7 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-lg flex items-center justify-center mr-2">
                            <i class="fas fa-hand-paper text-white text-xs"></i>
                        </div>
                        Hand Gestures
                    </h3>
                    <div class="space-y-3">
                        <div class="flex items-center text-gray-700 text-xs bg-emerald-50 p-2 rounded-xl">
                            <div class="gesture-icon w-8 h-8 rounded-lg flex items-center justify-center mr-3 flex-shrink-0">
                                <i class="fas fa-thumbs-up text-emerald-600 text-sm"></i>
                            </div>
                            <span class="font-medium">Thumbs up = Add to cart</span>
                        </div>
                        <div class="flex items-center text-gray-700 text-xs bg-emerald-50 p-2 rounded-xl">
                            <div class="gesture-icon w-8 h-8 rounded-lg flex items-center justify-center mr-3 flex-shrink-0">
                                <i class="fas fa-hand-point-right text-emerald-600 text-sm"></i>
                            </div>
                            <span class="font-medium">Point right = Next image</span>
                        </div>
                        <div class="flex items-center text-gray-700 text-xs bg-emerald-50 p-2 rounded-xl">
                            <div class="gesture-icon w-8 h-8 rounded-lg flex items-center justify-center mr-3 flex-shrink-0">
                                <i class="fas fa-hand-point-left text-emerald-600 text-sm"></i>
                            </div>
                            <span class="font-medium">Point left = Previous</span>
                        </div>
                    </div>
                    <div id="gesture-status" class="mt-4 text-center text-emerald-700 font-bold text-sm bg-emerald-50 border-2 border-emerald-200 rounded-xl py-2 empty:hidden"></div>
                </div>
            </div>

            <!-- Center - Video Feed -->
            <div class="lg:col-span-2">
                <div class="video-container bg-gradient-to-br from-gray-900 to-gray-800 relative">
                    <img src="{{ url_for('video_feed') }}" 
                         class="video-feed w-full h-auto max-w-full" 
                         alt="Virtual Try-On Camera Feed" />
                    
                    <!-- Floating Controls -->
                    <div class="absolute top-5 right-5 flex flex-col space-y-3">
                        <button onclick="capturePhoto()" class="control-button w-12 h-12 rounded-2xl flex items-center justify-center text-white group">
                            <i class="fas fa-camera text-base group-hover:scale-110 transition-transform"></i>
                        </button>
                        <button onclick="toggleFullscreen()" class="control-button w-12 h-12 rounded-2xl flex items-center justify-center text-white group">
                            <i class="fas fa-expand text-base group-hover:scale-110 transition-transform"></i>
                        </button>
                    </div>

                    <!-- Status Badge -->
                    <div class="absolute bottom-5 left-5">
                        <div class="flex items-center space-x-2 overlay-badge px-4 py-2 rounded-full">
                            <div id="camera-status" class="w-2.5 h-2.5 bg-white rounded-full pulse-green"></div>
                            <span class="text-white text-sm font-semibold tracking-wide">
                                <span id="status-text">Live Camera</span>
                            </span>
                        </div>
                    </div>

                    <!-- Image Counter -->
                    <div class="absolute bottom-5 right-5">
                        <span id="image-counter" class="overlay-badge px-4 py-2 rounded-full text-white text-sm font-bold">
                            Image 0/0
                        </span>
                    </div>
                </div>

                <!-- Control Buttons -->
                <div class="flex justify-center mt-6 space-x-4">
                    <button onclick="previousImage()" class="btn-secondary px-6 py-3 rounded-2xl font-bold flex items-center space-x-2 shadow-lg">
                        <i class="fas fa-chevron-left"></i>
                        <span>Previous</span>
                    </button>
                    <button onclick="addCurrentToCart()" class="btn-primary px-8 py-3 rounded-2xl font-bold flex items-center space-x-2">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Add to Cart</span>
                    </button>
                    <button onclick="nextImage()" class="btn-secondary px-6 py-3 rounded-2xl font-bold flex items-center space-x-2 shadow-lg">
                        <span>Next</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Right Panel - Metrics & Info -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Fit Metrics Panel -->
                <div class="glass-effect rounded-3xl p-5 card-modern">
                    <h3 class="text-lg font-bold text-gray-800 mb-5 flex items-center">
                        <div class="w-8 h-8 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-lg flex items-center justify-center mr-3">
                            <i class="fas fa-chart-line text-white text-sm"></i>
                        </div>
                        Fit Analysis
                    </h3>
                    <div class="space-y-4">
                        <div class="metric-card rounded-2xl p-4">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-gray-700 text-sm font-semibold">Fit Detection</span>
                                <i class="fas fa-check-circle text-emerald-500 text-lg"></i>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                <div id="fit-bar" class="progress-bar h-3 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
                            </div>
                            <span id="fit-percentage" class="text-emerald-600 text-xs font-bold mt-2 block">0%</span>
                        </div>
                        
                        <div class="metric-card rounded-2xl p-4">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-gray-700 text-sm font-semibold">Tracking Quality</span>
                                <i class="fas fa-signal text-emerald-500 text-lg"></i>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                <div id="tracking-bar" class="progress-bar h-3 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
                            </div>
                            <span id="tracking-percentage" class="text-emerald-600 text-xs font-bold mt-2 block">0%</span>
                        </div>
                    </div>
                </div>

                <!-- Product Info Panel -->
                <div class="glass-effect rounded-3xl p-5 card-modern">
                    <h3 class="text-lg font-bold text-gray-800 mb-5 flex items-center">
                        <div class="w-8 h-8 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-lg flex items-center justify-center mr-3">
                            <i class="fas fa-info-circle text-white text-sm"></i>
                        </div>
                        Product Details
                    </h3>
                    <div id="current-product-info" class="text-gray-600 text-sm space-y-3">
                        <div class="text-center py-8 text-gray-400">
                            <i class="fas fa-tshirt text-4xl mb-3 opacity-30"></i>
                            <p>No product loaded</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentImageIndex = 0;
        let productImages = [];
        let currentProduct = null;
        let cartItems = [];
        let cartTotal = 0;

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Virtual Try-On App initialized');
            console.log('Current URL:', window.location.pathname);
            
            {% if product_json %}
            try {
                const productData = {{ product_json|safe }};
                console.log('✅ Product data received from server:', productData);
                
                currentProduct = productData;
                productImages = currentProduct.images || [];
                currentImageIndex = 0;
                
                renderProductImages();
                updateProductInfo();
                updateImageCounter();
                showNotification('✨ Product loaded successfully!', 'success');
            } catch(error) {
                console.error('❌ Error parsing product data:', error);
                showNotification('❌ Error loading product data', 'error');
            }
            {% else %}
            console.log('⚠️ No product data from server');
            {% endif %}
            
            updateStatus();
            setInterval(updateStatus, 2000);
            updateCart();
        });

        function renderProductImages() {
            const grid = document.getElementById('product-images-grid');
            
            console.log('🖼️ Rendering images:', productImages.length);
            document.getElementById('total-images').textContent = productImages.length;
            
            if (productImages.length === 0) {
                grid.innerHTML = '<div class="text-gray-400 text-sm text-center py-12 col-span-2"><i class="fas fa-image text-4xl mb-3 opacity-30"></i><p>No images available</p></div>';
                return;
            }
            
            grid.innerHTML = '';
            productImages.forEach((imageUrl, index) => {
                console.log(`  Image ${index + 1}:`, imageUrl.substring(0, 50) + '...');
                
                const thumbDiv = document.createElement('div');
                thumbDiv.className = `image-thumbnail ${index === currentImageIndex ? 'active' : ''} aspect-square relative`;
                thumbDiv.innerHTML = `
                    <img src="${imageUrl}" 
                         alt="Product image ${index + 1}" 
                         class="w-full h-full object-cover"
                         onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27100%27 height=%27100%27%3E%3Crect fill=%27%23e5e7eb%27 width=%27100%27 height=%27100%27/%3E%3Ctext fill=%27%239ca3af%27 x=%2750%25%27 y=%2750%25%27 text-anchor=%27middle%27 dy=%27.3em%27 font-size=%2712%27%3ENo Image%3C/text%3E%3C/svg%3E';">
                    <div class="absolute top-2 right-2 bg-white bg-opacity-90 text-emerald-600 font-bold text-xs px-2 py-1 rounded-lg">
                        ${index + 1}
                    </div>
                `;
                thumbDiv.onclick = () => selectImage(index);
                grid.appendChild(thumbDiv);
            });
            
            console.log('✅ Images rendered successfully');
        }

        async function selectImage(index) {
            if (index < 0 || index >= productImages.length) return;
            
            console.log('🖱️ Selecting image:', index);
            
            try {
                const response = await fetch('/api/select_image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_index: index })
                });
                
                const result = await response.json();
                if (result.success) {
                    currentImageIndex = result.current_image;
                    renderProductImages();
                    updateImageCounter();
                    console.log('✅ Image selected:', currentImageIndex);
                }
            } catch (error) {
                console.error('❌ Error selecting image:', error);
            }
        }

        async function nextImage() {
            if (productImages.length > 0) {
                await selectImage((currentImageIndex + 1) % productImages.length);
            }
        }

        async function previousImage() {
            if (productImages.length > 0) {
                await selectImage((currentImageIndex - 1 + productImages.length) % productImages.length);
            }
        }

        function updateImageCounter() {
            const counter = document.getElementById('image-counter');
            if (productImages.length > 0) {
                counter.innerHTML = `<i class="fas fa-images mr-1"></i> ${currentImageIndex + 1}/${productImages.length}`;
            } else {
                counter.textContent = 'No images';
            }
        }

        function updateProductInfo() {
            const infoDiv = document.getElementById('current-product-info');
            
            console.log('📝 Updating product info:', currentProduct);
            
            if (currentProduct) {
                infoDiv.innerHTML = `
                    <div class="space-y-3">
                        <div class="bg-emerald-50 p-3 rounded-xl">
                            <p class="text-xs text-emerald-700 font-semibold mb-1">Product Name</p>
                            <p class="text-gray-800 font-bold">${currentProduct.name}</p>
                        </div>
                        <div class="bg-emerald-50 p-3 rounded-xl">
                            <p class="text-xs text-emerald-700 font-semibold mb-1">Brand</p>
                            <p class="text-gray-800 font-bold">${currentProduct.brand}</p>
                        </div>
                        <div class="bg-gradient-to-r from-emerald-500 to-emerald-600 p-4 rounded-xl text-white">
                            <p class="text-xs font-semibold mb-1 opacity-90">Price</p>
                            <p class="text-2xl font-bold">$${currentProduct.price.toFixed(2)}</p>
                            ${currentProduct.original_price !== currentProduct.price ? 
                                `<p class="text-sm line-through opacity-75">$${currentProduct.original_price.toFixed(2)}</p>` : ''}
                        </div>
                        ${currentProduct.discount > 0 ? 
                            `<div class="bg-red-50 p-3 rounded-xl border-2 border-red-200">
                                <p class="text-red-600 font-bold text-center">🎉 ${currentProduct.discount}% OFF</p>
                            </div>` : ''}
                        <div class="bg-emerald-50 p-3 rounded-xl">
                            <p class="text-xs text-emerald-700 font-semibold mb-1">Stock Status</p>
                            <p class="font-bold ${currentProduct.stock > 0 ? 'text-emerald-600' : 'text-red-600'}">
                                ${currentProduct.stock > 0 ? 
                                    `<i class="fas fa-check-circle mr-1"></i>${currentProduct.stock} available` : 
                                    '<i class="fas fa-times-circle mr-1"></i>Out of stock'}
                            </p>
                        </div>
                        ${currentProduct.description ? `<div class="text-xs text-gray-600 bg-gray-50 p-3 rounded-xl">${currentProduct.description}</div>` : ''}
                    </div>
                `;
                console.log('✅ Product info updated');
            } else {
                infoDiv.innerHTML = '<div class="text-center py-8 text-gray-400"><i class="fas fa-tshirt text-4xl mb-3 opacity-30"></i><p>No product loaded</p></div>';
                console.log('⚠️ No product to display');
            }
        }

        async function capturePhoto() {
            try {
                showNotification('📸 Capturing photo...', 'info');
                
                const captureResponse = await fetch('/api/capture_photo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (captureResponse.ok) {
                    const result = await captureResponse.json();
                    if (result.success) {
                        showNotification('✨ Photo captured! Downloading...', 'success');
                        
                        setTimeout(() => {
                            const link = document.createElement('a');
                            link.href = '/api/download_photo?' + Date.now();
                            link.download = `virtual_tryout_${Date.now()}.jpg`;
                            link.style.display = 'none';
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            
                            showNotification('📥 Photo downloaded!', 'success');
                        }, 1000);
                    } else {
                        showNotification('❌ Failed to capture photo', 'error');
                    }
                } else {
                    showNotification('❌ Capture request failed', 'error');
                }
            } catch (error) {
                console.error('Photo capture error:', error);
                showNotification('❌ An error occurred', 'error');
            }
        }

        async function addCurrentToCart() {
            if (!currentProduct) {
                showNotification('⚠️ No product selected', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: currentProduct.productId || currentProduct.id })
                });
                const result = await response.json();
                if (result.success) {
                    updateCart();
                    showNotification('✅ Added to cart!', 'success');
                } else {
                    showNotification(result.error || 'Failed to add to cart', 'error');
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                showNotification('❌ Error adding to cart', 'error');
            }
        }

        async function updateCart() {
            try {
                const response = await fetch('/api/cart');
                const cartData = await response.json();
                cartItems = cartData.items;
                cartTotal = cartData.total;
                
                document.getElementById('cart-count').textContent = cartData.count;
            } catch (error) {
                console.error('Error updating cart:', error);
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                document.getElementById('fit-bar').style.width = status.fit_detection + '%';
                document.getElementById('fit-percentage').textContent = Math.round(status.fit_detection) + '%';
                
                document.getElementById('tracking-bar').style.width = status.tracking_quality + '%';
                document.getElementById('tracking-percentage').textContent = Math.round(status.tracking_quality) + '%';
                
                document.getElementById('cart-count').textContent = status.cart_count;
                
                if (status.last_gesture && status.last_gesture !== 'None' && status.last_gesture !== null) {
                    document.getElementById('gesture-status').textContent = `✨ ${status.last_gesture.replace('_', ' ')}`;
                    setTimeout(() => {
                        document.getElementById('gesture-status').textContent = '';
                    }, 2000);
                }
                
                if (status.current_image !== currentImageIndex && productImages.length > 0) {
                    currentImageIndex = status.current_image;
                    renderProductImages();
                    updateImageCounter();
                }
                
                const overlayIcon = document.getElementById('overlay-icon');
                const overlayText = document.getElementById('overlay-text');
                if (status.shirt_overlay_active) {
                    overlayIcon.className = 'fas fa-eye mr-2';
                    overlayText.textContent = 'Overlay';
                } else {
                    overlayIcon.className = 'fas fa-eye-slash mr-2';
                    overlayText.textContent = 'Overlay';
                }
                
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function toggleOverlay() {
            try {
                const response = await fetch('/api/toggle_overlay', { method: 'POST' });
                const result = await response.json();
                showNotification(`Overlay ${result.overlay_active ? 'enabled' : 'disabled'}`, 'info');
            } catch (error) {
                console.error('Error toggling overlay:', error);
            }
        }

        function toggleFullscreen() {
            const videoContainer = document.querySelector('.video-container');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                videoContainer.requestFullscreen();
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            const colors = {
                success: 'bg-gradient-to-r from-emerald-500 to-emerald-600 text-white border-emerald-400',
                error: 'bg-white text-red-600 border-red-400',
                info: 'bg-gradient-to-r from-emerald-500 to-emerald-600 text-white border-emerald-400'
            };
            
            notification.className = `fixed top-24 right-6 z-50 px-6 py-4 rounded-2xl border-2 ${colors[type]} shadow-2xl transition-all transform translate-x-0 opacity-100`;
            notification.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} text-xl"></i>
                    <span class="font-semibold">${message}</span>
                </div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(400px)';
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
